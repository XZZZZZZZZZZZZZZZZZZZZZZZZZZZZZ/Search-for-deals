<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טירוף דיל - כל המבצעים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap');
        
        body { 
            font-family: 'Heebo', sans-serif; 
            background-image: linear-gradient(rgba(248, 250, 252, 0.92), rgba(248, 250, 252, 0.95)), url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        
        /* מנוע אנימציית החיפוש */
        #search-container {
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .search-center {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .search-top {
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-top: 4rem;
        }
        
        #results-section {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
            pointer-events: none;
        }
        #results-section.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .deal-card:hover .deal-img { transform: scale(1.05); }
    </style>
</head>
<body class="min-h-screen relative">

    <div class="absolute top-4 left-4 md:left-8 flex items-center gap-3 z-50">
        
        <button id="loginBtn" onclick="signInWithGoogle()" class="bg-white text-gray-700 px-5 py-2 rounded-full text-sm font-bold shadow-md hover:bg-gray-50 transition border border-gray-100 flex items-center gap-2">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google">
            <span id="loginText">התחברות מנהל</span>
        </button>

        <a href="mailto:dealsthatare@gmail.com?subject=פניה%20לטירוף%20דיל" class="bg-white text-blue-600 px-5 py-2 rounded-full text-sm font-bold shadow-md hover:bg-gray-50 transition border border-gray-100 flex items-center gap-2">
            <i class="fa-regular fa-envelope"></i> צור קשר
        </a>
        
        <button onclick="checkAdminAccess()" class="bg-blue-900 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md hover:bg-blue-800 transition flex items-center gap-2">
            <i class="fa-solid fa-lock"></i> מערכת ניהול
        </button>
    </div>

    <div id="search-container" class="search-center px-4 relative z-10">
        <div class="text-center mb-8 mt-10">
            <h1 class="text-5xl md:text-6xl font-black text-blue-900 mb-4 tracking-tight drop-shadow-sm">טירוף דיל</h1>
            <p class="text-xl text-gray-700 font-medium">המבצעים והקופונים הכי שווים ברשת - מנוע חיפוש חכם</p>
        </div>
        
        <div class="max-w-3xl mx-auto w-full relative shadow-[0_8px_30px_rgb(0,0,0,0.12)] rounded-full bg-white">
            <input type="text" id="searchInput" onkeypress="handleEnter(event)" placeholder="מה תרצו לחפש היום בעלי אקספרס?" class="w-full pr-6 pl-16 py-5 rounded-full text-lg border-2 border-transparent focus:border-blue-500 focus:outline-none bg-transparent">
            <button onclick="performSearch()" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-12 h-12 bg-blue-600 hover:bg-blue-700 transition rounded-full flex items-center justify-center text-white text-xl shadow-md cursor-pointer z-20">
                <i class="fa-solid fa-search"></i>
            </button>
        </div>
    </div>

    <div id="results-section" class="max-w-7xl mx-auto px-4 pb-32 hidden relative z-10">
        <div class="flex justify-between items-end mb-6 border-b border-gray-200 pb-2">
            <h2 class="text-2xl font-bold text-gray-800">תוצאות חיפוש:</h2>
            <span id="results-count" class="text-gray-500 text-sm font-semibold"></span>
        </div>
        
        <div id="loading-msg" class="hidden text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-5xl text-blue-500 mb-4"></i>
            <h3 class="text-xl font-bold text-gray-700">סורק את הרשת ומחפש דילים...</h3>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="deals-grid">
            </div>

        <div id="no-results-msg" class="hidden text-center py-12">
            <i class="fa-solid fa-box-open text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-bold text-gray-600" id="error-text">לא מצאנו דילים. נסו חיפוש אחר.</h3>
        </div>
    </div>

    <div class="fixed bottom-6 right-6 z-50">
        <a href="https://chat.whatsapp.com/JNtJ0rIHpNoGWnu5Nx0LXi" target="_blank" class="bg-white rounded-[20px] shadow-xl border border-gray-100 p-4 flex items-center gap-4 w-[340px] hover:shadow-2xl transition cursor-pointer group">
            <div class="bg-[#dcf8c6] text-[#25D366] w-14 h-14 rounded-full flex items-center justify-center text-3xl shrink-0 transition group-hover:scale-105">
                <i class="fa-brands fa-whatsapp"></i>
            </div>
            <div class="flex-1">
                <h4 class="font-black text-gray-800 text-lg flex items-center gap-2 mb-1">
                    חדשות הגזרה <span class="bg-[#f56565] text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider animate-pulse">LIVE</span>
                </h4>
                <p class="text-[13px] text-gray-500 leading-tight font-medium">הצטרפו לקבוצת הווצאפ של דילים שפשוט חבל לפספס</p>
            </div>
        </a>
    </div>

    <script>
        // ==========================================
        // מערכת התחברות למנהל בלבד (Google Auth)
        // ==========================================
        
        // 1. רשימת האימיילים המורשים להיכנס למערכת הניהול
        const ADMIN_EMAILS = ["dealsthatare@gmail.com"];
        
        // 2. הגדרות Firebase - יש להחליף את הנתונים כאן עם אלה של הפרויקט שלך
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // משתנים לשמירת מצב ההתחברות
        let auth = null;
        let currentUser = null;

        // אתחול מערכת ההתחברות (רק אם הכנסת מפתחות אמיתיים)
        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            
            // מאזין למצב התחברות (כשהדף עולה)
            auth.onAuthStateChanged(user => {
                const loginText = document.getElementById('loginText');
                const loginBtn = document.getElementById('loginBtn');
                
                if (user) {
                    currentUser = user;
                    loginText.innerText = "מחובר: " + user.displayName;
                    // החלפת אייקון גוגל בתמונת הפרופיל של המשתמש
                    loginBtn.querySelector('img').src = user.photoURL;
                    loginBtn.querySelector('img').classList.add('rounded-full');
                } else {
                    currentUser = null;
                    loginText.innerText = "התחברות מנהל";
                    loginBtn.querySelector('img').src = "https://www.svgrepo.com/show/475656/google-color.svg";
                    loginBtn.querySelector('img').classList.remove('rounded-full');
                }
            });
        }

        // פונקציית לחיצה על כפתור התחברות גוגל
        function signInWithGoogle() {
            if (!auth) {
                alert("מערכת ההתחברות לא פעילה. עליך להכניס את מפתחות ה-Firebase שלך בקוד ה-HTML.");
                return;
            }
            
            if (currentUser) {
                // המשתמש כבר מחובר - אפשרות להתנתק
                if (confirm("אתה כבר מחובר. האם ברצונך להתנתק?")) {
                    auth.signOut();
                }
                return;
            }
            
            // פתיחת חלון קופץ של גוגל
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => {
                console.error("שגיאה בהתחברות:", error);
                alert("אירעה שגיאה בהתחברות.");
            });
        }

        // פונקציה שמופעלת בלחיצה על "מערכת ניהול"
        function checkAdminAccess() {
            if (!auth) {
                alert("מערכת ההתחברות לא מוגדרת. מעביר למערכת הניהול (מצב פיתוח בלבד).");
                window.location.href = "/admin"; // למקרה שאתה בודק לפני שהגדרת פיירבייס
                return;
            }
            
            if (!currentUser) {
                alert("עליך להתחבר עם חשבון גוגל מורשה כדי לגשת למערכת הניהול.");
                return;
            }
            
            // בדיקה האם האימייל מורשה
            if (ADMIN_EMAILS.includes(currentUser.email)) {
                window.location.href = "/admin";
            } else {
                alert(`החשבון המחובר (${currentUser.email}) אינו מורשה לניהול המערכת.`);
            }
        }


        // ==========================================
        // מנוע חיפוש עלי אקספרס (הלוגיקה המקורית)
        // ==========================================

        function handleEnter(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const container = document.getElementById('search-container');
            const resultsSection = document.getElementById('results-section');
            const grid = document.getElementById('deals-grid');
            const loading = document.getElementById('loading-msg');
            const noResults = document.getElementById('no-results-msg');
            const countDisplay = document.getElementById('results-count');

            container.classList.remove('search-center');
            container.classList.add('search-top');
            resultsSection.classList.remove('hidden');
            
            setTimeout(() => {
                resultsSection.classList.add('show');
            }, 50);

            grid.innerHTML = '';
            noResults.classList.add('hidden');
            loading.classList.remove('hidden');
            countDisplay.innerText = 'טוען...';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                loading.classList.add('hidden');

                if (data.error) {
                    showError(data.error);
                    return;
                }

                if (!data || data.length === 0) {
                    showError('לא נמצאו מוצרים תואמים לחיפוש שלך.');
                    return;
                }

                countDisplay.innerText = `נמצאו ${data.length} דילים חמים`;
                renderRealDeals(data);

            } catch (error) {
                console.error("שגיאת תקשורת:", error);
                loading.classList.add('hidden');
                showError('אופס, הייתה בעיה בתקשורת מול השרת. נסו שוב.');
            }
        }

        function showError(msg) {
            document.getElementById('deals-grid').innerHTML = '';
            document.getElementById('no-results-msg').classList.remove('hidden');
            document.getElementById('error-text').innerText = msg;
            document.getElementById('results-count').innerText = '0 תוצאות';
        }

        function renderRealDeals(products) {
            const grid = document.getElementById('deals-grid');
            let html = '';

            products.forEach(p => {
                const title = p.product_title || 'מוצר ללא שם';
                const image = p.product_main_image_url || '';
                const price = p.target_app_sale_price || p.target_sale_price || '0.00';
                const link = p.promotion_link || '#';
                
                const discount = p.discount || '';
                const tagHtml = discount ? `<div class="absolute top-3 right-3 bg-red-600 text-white text-sm font-black px-3 py-1 rounded shadow-sm">${discount}</div>` : '';

                html += `
                    <div class="deal-card bg-white rounded-xl shadow hover:shadow-lg transition-all duration-300 overflow-hidden border border-gray-100 flex flex-col h-full">
                        <div class="relative h-48 overflow-hidden bg-white flex items-center justify-center p-2 border-b border-gray-50">
                            <img src="${image}" alt="תמונת מוצר" class="deal-img w-full h-full object-contain transition-transform duration-500">
                            ${tagHtml}
                        </div>
                        <div class="p-4 flex flex-col flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="bg-[#ff4747] text-white text-[10px] font-bold px-2 py-0.5 rounded">AliExpress</span>
                            </div>
                            <h3 class="text-sm font-bold text-gray-800 leading-tight mb-3 flex-1 line-clamp-3" title="${title}">${title}</h3>
                            
                            <div class="flex justify-between items-center mt-auto pt-3 border-t border-gray-100">
                                <span class="text-xl font-black text-blue-700">₪${price}</span>
                                <a href="${link}" target="_blank" class="bg-[#ff6a00] hover:bg-[#e65f00] text-white px-4 py-1.5 rounded font-bold transition shadow-sm text-sm">
                                    לקנייה
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }
    </script>
</body>
</html>
