<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טירוף דיל - כל המבצעים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap');
        
        body { 
            font-family: 'Heebo', sans-serif; 
            background-image: linear-gradient(rgba(248, 250, 252, 0.92), rgba(248, 250, 252, 0.95)), url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        
        #search-container { transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
        .search-center { height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        .search-top { height: 250px; display: flex; flex-direction: column; justify-content: center; padding-top: 5rem; }
        
        #results-section {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
            pointer-events: none;
        }
        #results-section.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .deal-card:hover .deal-img { transform: scale(1.05); }

        /* אפקט ריחוף לעריכת הלוגו למנהלים */
        .admin-edit-hover {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.2s;
            cursor: pointer;
        }
        .logo-container:hover .admin-edit-hover { opacity: 1; }
    </style>
</head>
<body class="min-h-screen relative">

    <header class="absolute top-0 w-full p-4 md:px-8 flex justify-between items-start z-50 pointer-events-none">
        
        <div class="pointer-events-auto flex items-center gap-2 relative logo-container group" onclick="if(isAdmin) toggleAdminPanel()">
            <img id="header-logo" src="" alt="לוגו" class="h-12 hidden object-contain">
            <span id="header-title" class="text-3xl font-black text-blue-900 drop-shadow-sm px-2">טירוף דיל</span>
            <div id="header-edit-overlay" class="admin-edit-hover hidden">
                <i class="fa-solid fa-pen text-xl"></i>
            </div>
        </div>

        <div class="pointer-events-auto flex items-center gap-3">
            
            <a href="mailto:dealsthatare@gmail.com?subject=פניה%20לטירוף%20דיל" class="bg-white text-blue-600 px-5 py-2 rounded-full text-sm font-bold shadow-md hover:bg-gray-50 transition border border-gray-100 flex items-center gap-2 hidden md:flex">
                <i class="fa-regular fa-envelope"></i> צור קשר
            </a>

            <button id="loginBtn" onclick="handleLogin()" class="bg-white text-gray-700 px-5 py-2 rounded-full text-sm font-bold shadow-md hover:bg-gray-50 transition border border-gray-100 flex items-center gap-2">
                <img id="loginIcon" src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google">
                <span id="loginText">התחברות</span>
            </button>
            
            <button id="adminBtn" onclick="toggleAdminPanel()" class="hidden bg-blue-900 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md hover:bg-blue-800 transition flex items-center gap-2">
                <i class="fa-solid fa-gear"></i> ניהול
            </button>
        </div>
    </header>

    <div id="search-container" class="search-center px-4 relative z-10">
        <div class="text-center mb-8 mt-10 flex flex-col items-center">
            
            <div class="relative logo-container group inline-block" onclick="if(isAdmin) toggleAdminPanel()">
                <img id="main-logo" src="" alt="לוגו" class="h-24 hidden mb-4 object-contain">
                <h1 id="main-title" class="text-5xl md:text-7xl font-black text-blue-900 mb-4 tracking-tight drop-shadow-sm px-4 py-2">טירוף דיל</h1>
                <div id="main-edit-overlay" class="admin-edit-hover hidden">
                    <i class="fa-solid fa-pen text-3xl"></i>
                </div>
            </div>

        </div>
        
        <div class="max-w-3xl mx-auto w-full relative shadow-[0_8px_30px_rgb(0,0,0,0.12)] rounded-full bg-white border border-gray-200">
            <input type="text" id="searchInput" onkeypress="handleEnter(event)" placeholder="חפשו בעלי אקספרס (המוצרים הנמכרים ביותר)..." class="w-full pr-6 pl-16 py-5 rounded-full text-lg border-2 border-transparent focus:border-blue-500 focus:outline-none bg-transparent">
            <button onclick="performSearch(false)" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-12 h-12 bg-blue-600 hover:bg-blue-700 transition rounded-full flex items-center justify-center text-white text-xl shadow-md cursor-pointer z-20">
                <i class="fa-solid fa-search"></i>
            </button>
        </div>
    </div>

    <div id="results-section" class="max-w-7xl mx-auto px-4 pb-32 hidden relative z-10">
        <div class="flex justify-between items-end mb-6 border-b border-gray-200 pb-2">
            <h2 class="text-2xl font-bold text-gray-800">תוצאות חיפוש:</h2>
            <span id="results-count" class="text-gray-500 text-sm font-semibold"></span>
        </div>
        
        <div id="loading-msg" class="hidden text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-5xl text-blue-500 mb-4"></i>
            <h3 class="text-xl font-bold text-gray-700">סורק את הרשת ומחפש דילים חמים...</h3>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="deals-grid"></div>

        <div id="no-results-msg" class="hidden text-center py-12">
            <i class="fa-solid fa-box-open text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-bold text-gray-600" id="error-text">לא מצאנו דילים. נסו חיפוש אחר.</h3>
        </div>

        <div id="load-more-container" class="hidden text-center mt-10">
            <button id="load-more-btn" onclick="performSearch(true)" class="bg-gray-100 text-blue-700 border border-blue-200 px-8 py-3 rounded-full font-bold hover:bg-blue-50 transition shadow-sm">
                הצג תוצאות נוספות <i class="fa-solid fa-angle-down ml-1"></i>
            </button>
        </div>
    </div>

    <div class="fixed bottom-6 right-6 z-50">
        <a href="https://chat.whatsapp.com/JNtJ0rIHpNoGWnu5Nx0LXi" target="_blank" class="bg-white rounded-2xl shadow-xl border border-gray-100 p-4 flex items-center gap-4 hover:shadow-2xl transition cursor-pointer max-w-[320px]">
            <div class="flex-1 text-right">
                <h4 class="font-black text-gray-800 text-[16px] leading-tight mb-1">
                    קבוצת הווצאפ של דילים שפשוט חבל לפספס
                </h4>
            </div>
            <div class="bg-[#dcf8c6] text-[#25D366] w-14 h-14 rounded-full flex items-center justify-center text-3xl shrink-0">
                <i class="fa-brands fa-whatsapp"></i>
            </div>
        </a>
    </div>

    <div id="adminPanel" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl overflow-hidden max-w-3xl w-full mx-4 flex flex-col md:flex-row min-h-[400px]">
            
            <div class="bg-gray-50 border-l border-gray-200 w-full md:w-64 p-6 shrink-0">
                <h2 class="text-xl font-black text-blue-900 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved"></i> לוח בקרה
                </h2>
                <nav class="space-y-2">
                    <button class="w-full text-right bg-blue-100 text-blue-700 font-bold px-4 py-2 rounded flex items-center gap-2">
                        <i class="fa-solid fa-image w-5"></i> עיצוב ולוגו
                    </button>
                </nav>
            </div>

            <div class="p-8 flex-1 relative">
                <button onclick="toggleAdminPanel()" class="absolute top-4 left-4 text-gray-400 hover:text-red-500 text-xl"><i class="fa-solid fa-times"></i></button>
                
                <h3 class="text-2xl font-bold text-gray-800 mb-6">הגדרות עיצוב</h3>
                
                <div class="bg-blue-50 border border-blue-100 p-4 rounded-lg mb-6">
                    <label class="block text-sm font-bold text-blue-900 mb-2">קישור ללוגו האתר (URL)</label>
                    <div class="flex gap-2">
                        <input type="text" id="logoUrlInput" placeholder="https://example.com/logo.png" class="w-full border border-gray-300 rounded p-3 bg-white focus:outline-none focus:border-blue-500 text-left" dir="ltr">
                    </div>
                    <p class="text-xs text-blue-700 mt-2"><i class="fa-solid fa-circle-info"></i> השאר ריק כדי להציג את שם האתר כטקסט רגיל.</p>
                </div>
                
                <div class="flex justify-end mt-auto">
                    <button onclick="saveLogo()" class="bg-blue-600 text-white font-bold px-8 py-3 rounded-lg hover:bg-blue-700 transition shadow-md">
                        <i class="fa-solid fa-save ml-2"></i> שמור שינויים
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isAdmin = false;
        const ADMIN_EMAIL = "xzz556786407@gmail.com";
        
        // מזהה הלקוח שיצרנו ב-Google Cloud
        const GOOGLE_CLIENT_ID = "771547752274-da76jqca0jioi6uh9vhuj5ivqia836m7.apps.googleusercontent.com";

        // ==========================================
        // מפתחות ה-Firebase הרשמיים והסופיים שלך!
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAMsXL7zwUCn1GhJXeOMbgZqND6_bHJdBw",
            authDomain: "studio-3881008331-9ecf6.firebaseapp.com",
            projectId: "studio-3881008331-9ecf6",
            storageBucket: "studio-3881008331-9ecf6.firebasestorage.app",
            messagingSenderId: "771547752274",
            appId: "1:771547752274:web:dd08706e475ed57a68bc8b"
        };

        // אתחול רשמי של פיירבייס
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // האזנה למצב החיבור של גוגל
        firebase.auth().onAuthStateChanged(user => {
            if (user && user.email === ADMIN_EMAIL) {
                setAdminState(true, user.displayName, user.photoURL);
            } else if (user) {
                alert("החשבון המחובר אינו מורשה כמנהל המערכת.");
                firebase.auth().signOut();
                setAdminState(false);
            } else {
                setAdminState(false);
            }
        });

        // לוגיקת ההתחברות הרשמית של גוגל
        function handleLogin() {
            if (isAdmin) {
                if (confirm("האם ברצונך להתנתק מהמערכת?")) {
                    firebase.auth().signOut();
                }
                return;
            }

            const provider = new firebase.auth.GoogleAuthProvider();
            // פיירבייס יודע להשתמש אוטומטית בהגדרות שהזנו במסוף שלו
            firebase.auth().signInWithPopup(provider).catch(error => {
                console.error("שגיאה בתהליך החיבור לגוגל:", error);
                alert("ההתחברות נכשלה. ודא כי הגדרת ה-OAuth מאושרת במסוף פיירבייס.");
            });
        }

        function setAdminState(state, name = "", photo = "") {
            isAdmin = state;
            const loginText = document.getElementById('loginText');
            const loginIcon = document.getElementById('loginIcon');
            const adminBtn = document.getElementById('adminBtn');
            const headerEdit = document.getElementById('header-edit-overlay');
            const mainEdit = document.getElementById('main-edit-overlay');

            if (isAdmin) {
                loginText.innerText = name;
                loginIcon.src = photo;
                loginIcon.classList.add('rounded-full');
                adminBtn.classList.remove('hidden');
                if(headerEdit) headerEdit.classList.remove('hidden');
                if(mainEdit) mainEdit.classList.remove('hidden');
            } else {
                loginText.innerText = "התחברות";
                loginIcon.src = "https://www.svgrepo.com/show/475656/google-color.svg";
                loginIcon.classList.remove('rounded-full');
                adminBtn.classList.add('hidden');
                if(headerEdit) headerEdit.classList.add('hidden');
                if(mainEdit) mainEdit.classList.add('hidden');
            }
        }

        // ==========================================
        // מערכת ניהול - הגדרות לוגו
        // ==========================================
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
            document.getElementById('logoUrlInput').value = localStorage.getItem('siteLogo') || '';
        }

        function saveLogo() {
            const logoUrl = document.getElementById('logoUrlInput').value.trim();
            localStorage.setItem('siteLogo', logoUrl);
            applyLogo();
            toggleAdminPanel();
        }

        function applyLogo() {
            const logoUrl = localStorage.getItem('siteLogo');
            const hLogo = document.getElementById('header-logo');
            const hTitle = document.getElementById('header-title');
            const mLogo = document.getElementById('main-logo');
            const mTitle = document.getElementById('main-title');

            if (logoUrl) {
                if(hLogo) { hLogo.src = logoUrl; hLogo.classList.remove('hidden'); }
                if(hTitle) hTitle.classList.add('hidden');
                if(mLogo) { mLogo.src = logoUrl; mLogo.classList.remove('hidden'); }
                if(mTitle) mTitle.classList.add('hidden');
            } else {
                if(hLogo) hLogo.classList.add('hidden');
                if(hTitle) hTitle.classList.remove('hidden');
                if(mLogo) mLogo.classList.add('hidden');
                if(mTitle) mTitle.classList.remove('hidden');
            }
        }
        
        applyLogo(); 

        // ==========================================
        // מנוע חיפוש והצג עוד עמודים
        // ==========================================
        let currentPage = 1;
        let currentQuery = '';

        function handleEnter(event) {
            if (event.key === 'Enter') performSearch(false);
        }

        async function performSearch(isLoadMore) {
            const query = document.getElementById('searchInput').value.trim();
            if (!query && !isLoadMore) return;

            const container = document.getElementById('search-container');
            const resultsSection = document.getElementById('results-section');
            const grid = document.getElementById('deals-grid');
            const loading = document.getElementById('loading-msg');
            const noResults = document.getElementById('no-results-msg');
            const countDisplay = document.getElementById('results-count');
            const loadMoreContainer = document.getElementById('load-more-container');
            const loadMoreBtn = document.getElementById('load-more-btn');

            if (!isLoadMore) {
                currentPage = 1;
                currentQuery = query;
                grid.innerHTML = '';
                loadMoreContainer.classList.add('hidden');
                
                container.classList.remove('search-center');
                container.classList.add('search-top');
                resultsSection.classList.remove('hidden');
                setTimeout(() => resultsSection.classList.add('show'), 50);
                
                noResults.classList.add('hidden');
                loading.classList.remove('hidden');
                countDisplay.innerText = 'טוען תוצאות...';
            } else {
                currentPage++;
                loadMoreBtn.innerText = 'טוען דילים נוספים...';
                loadMoreBtn.disabled = true;
            }

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(currentQuery)}&page=${currentPage}`);
                const data = await response.json();

                if (!isLoadMore) loading.classList.add('hidden');

                if (data.error || (!data || data.length === 0)) {
                    if (!isLoadMore) {
                        showError(data.error || 'לא מצאנו דילים. נסו חיפוש אחר.');
                    } else {
                        loadMoreBtn.innerText = 'אין עוד תוצאות';
                        loadMoreBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    }
                    return;
                }

                if (!isLoadMore) countDisplay.innerText = `מציג תוצאות חיות עבור החיפוש`;
                
                renderRealDeals(data);

                loadMoreContainer.classList.remove('hidden');
                loadMoreBtn.innerHTML = 'הצג תוצאות נוספות <i class="fa-solid fa-angle-down ml-1"></i>';
                loadMoreBtn.disabled = false;

            } catch (error) {
                console.error("שגיאה:", error);
                if (!isLoadMore) {
                    loading.classList.add('hidden');
                    showError('שגיאת תקשורת מול עלי אקספרס.');
                }
            }
        }

        function showError(msg) {
            document.getElementById('deals-grid').innerHTML = '';
            document.getElementById('no-results-msg').classList.remove('hidden');
            document.getElementById('error-text').innerText = msg;
            document.getElementById('load-more-container').classList.add('hidden');
        }

        function renderRealDeals(products) {
            const grid = document.getElementById('deals-grid');
            let html = '';

            products.forEach(p => {
                const title = p.product_title || 'מוצר';
                const image = p.product_main_image_url || '';
                const price = p.target_app_sale_price || p.target_sale_price || '0.00';
                const link = p.promotion_link || '#';
                
                const rating = p.evaluate_rate ? parseFloat(p.evaluate_rate).toFixed(1) : '4.5+';

                html += `
                    <div class="deal-card bg-white rounded-xl shadow hover:shadow-lg transition-all duration-300 overflow-hidden border border-gray-100 flex flex-col h-full">
                        <div class="relative h-48 overflow-hidden bg-white flex items-center justify-center p-2 border-b border-gray-50">
                            <img src="${image}" alt="תמונה" class="deal-img w-full h-full object-contain transition-transform duration-500">
                        </div>
                        <div class="p-4 flex flex-col flex-1">
                            <div class="flex items-center justify-between mb-2">
                                <span class="bg-[#ff4747] text-white text-[10px] font-bold px-2 py-0.5 rounded">AliExpress</span>
                                <span class="text-xs font-bold text-yellow-500"><i class="fa-solid fa-star"></i> ${rating}</span>
                            </div>
                            <h3 class="text-sm font-bold text-gray-800 leading-tight mb-3 flex-1 line-clamp-3" title="${title}">${title}</h3>
                            <div class="flex justify-between items-center mt-auto pt-3 border-t border-gray-100">
                                <span class="text-xl font-black text-blue-700">₪${price}</span>
                                <a href="${link}" target="_blank" class="bg-[#ff6a00] text-white px-4 py-1.5 rounded font-bold hover:bg-[#e65f00] transition text-sm">לקנייה</a>
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.insertAdjacentHTML('beforeend', html);
        }
    </script>
</body>
</html>
